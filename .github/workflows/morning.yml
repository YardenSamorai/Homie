# Calls the notification pass every 15 minutes: each parent's morning summary at the time and on the days they
# chose, in their zone; the wrap-up when their quiet hours end; the digest. It also clears status photos past
# their 24 hours. Vercel's free plan runs a job only once a day.
#
# Secret: CRON_SECRET, the same value as on Vercel.
name: Morning summary

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send what's due now
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" https://homie-taupe.vercel.app/api/cron/morning
