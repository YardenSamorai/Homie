# Calls the morning summary every hour; the server sends to each parent at the hour they chose
# in Settings, and clears status photos past their 24 hours. Vercel's free plan runs a job only once a day.
#
# Secret: CRON_SECRET, the same value as on Vercel.
name: Morning summary

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send this hour's summaries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" https://homie-taupe.vercel.app/api/cron/morning
